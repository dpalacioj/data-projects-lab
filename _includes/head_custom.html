<!--
  Comportamiento personalizado del sitio:

  1) Los enlaces DENTRO del contenido (no los del sidebar ni prev/next)
     se abren en una pestaña nueva, para que el lector no pierda su
     lugar. Esto incluye los links a otros README/tutoriales que
     aparezcan en medio de un texto, pero NO afecta:
       - El sidebar de navegacion a la izquierda.
       - Los botones prev/next al pie de la pagina.
       - Los enlaces de la ruta (breadcrumbs).
       - Los enlaces #seccion dentro de la misma pagina.

  2) Toggle claro/oscuro en la barra superior.
     - just-the-docs expone `jtd.setTheme('light' | 'dark')` para
       alternar paletas en vivo sin recargar la pagina.
     - El boton se inserta en `.aux-nav` (donde ya vive "Ver en GitHub")
       la primera vez que el DOM esta listo.
     - La preferencia del usuario se guarda en `localStorage` con la
       clave `jtd-color-scheme`, y se restaura en cargas posteriores.
     - Si el usuario nunca ha elegido manualmente, se respeta
       `prefers-color-scheme` del sistema operativo.
-->
<style>
  /* Boton del toggle: compacto, consistente con los aux_links de la barra superior. */
  .theme-toggle {
    background: transparent;
    border: 1px solid rgba(128, 128, 128, 0.35);
    border-radius: 6px;
    padding: 2px 10px;
    margin-left: 8px;
    font-size: 14px;
    cursor: pointer;
    color: inherit;
    line-height: 1.6;
    white-space: nowrap;
  }
  .theme-toggle:hover {
    background: rgba(128, 128, 128, 0.12);
  }

  /*
    Dark mode manual: just-the-docs via remote_theme solo compila el
    stylesheet "default" (light). En vez de depender de jtd.setTheme
    (que necesita dos stylesheets precompilados), aplicamos una capa
    de overrides CSS cuando el <html> tiene el atributo
    data-theme="dark". Esto garantiza que el toggle funcione sin
    importar la version del remote_theme instalada por GitHub Pages.
  */
  html[data-theme="dark"] {
    background-color: #15161a !important;
    color: #e4e4e7 !important;
    color-scheme: dark;
  }
  html[data-theme="dark"] body {
    background-color: #15161a !important;
    color: #e4e4e7 !important;
  }
  html[data-theme="dark"] .side-bar,
  html[data-theme="dark"] .main-header {
    background-color: #1f2026 !important;
    border-color: #2a2b31 !important;
  }
  html[data-theme="dark"] .site-title,
  html[data-theme="dark"] .site-footer {
    color: #e4e4e7 !important;
  }
  html[data-theme="dark"] .nav-list .nav-list-item .nav-list-link {
    color: #c7d2fe !important;
  }
  html[data-theme="dark"] .nav-list .nav-list-item .nav-list-link:hover,
  html[data-theme="dark"] .nav-list .nav-list-item .nav-list-link.active {
    background-image: linear-gradient(-90deg, rgba(99, 102, 241, 0.15) 0%, rgba(99, 102, 241, 0.25) 100%) !important;
    color: #ffffff !important;
  }
  html[data-theme="dark"] .main-content a {
    color: #93c5fd !important;
  }
  html[data-theme="dark"] .main-content a:hover {
    color: #bfdbfe !important;
  }
  html[data-theme="dark"] .main-content h1,
  html[data-theme="dark"] .main-content h2,
  html[data-theme="dark"] .main-content h3,
  html[data-theme="dark"] .main-content h4,
  html[data-theme="dark"] .main-content h5,
  html[data-theme="dark"] .main-content h6 {
    color: #f4f4f5 !important;
    border-color: #2a2b31 !important;
  }
  html[data-theme="dark"] .main-content code,
  html[data-theme="dark"] code.language-plaintext {
    background-color: #27282f !important;
    color: #fbbf24 !important;
    border: 1px solid #3a3b42 !important;
  }
  html[data-theme="dark"] .main-content pre,
  html[data-theme="dark"] .main-content div.highlighter-rouge,
  html[data-theme="dark"] .main-content figure.highlight {
    background-color: #1b1c21 !important;
    border: 1px solid #2a2b31 !important;
  }
  html[data-theme="dark"] .main-content pre code {
    background-color: transparent !important;
    color: #e4e4e7 !important;
    border: none !important;
  }
  html[data-theme="dark"] .main-content table {
    border-color: #2a2b31 !important;
  }
  html[data-theme="dark"] .main-content table th {
    background-color: #22232a !important;
    color: #f4f4f5 !important;
    border-color: #2a2b31 !important;
  }
  html[data-theme="dark"] .main-content table td {
    background-color: #1b1c21 !important;
    color: #e4e4e7 !important;
    border-color: #2a2b31 !important;
  }
  html[data-theme="dark"] .main-content blockquote {
    background-color: #1b1c21 !important;
    border-left-color: #4b5563 !important;
    color: #d4d4d8 !important;
  }
  html[data-theme="dark"] .main-content hr {
    background-color: #2a2b31 !important;
    border-color: #2a2b31 !important;
  }
  html[data-theme="dark"] .search-input,
  html[data-theme="dark"] .search-input-wrap {
    background-color: #1b1c21 !important;
    color: #e4e4e7 !important;
    border-color: #2a2b31 !important;
  }
  html[data-theme="dark"] .search-results-list {
    background-color: #1b1c21 !important;
    color: #e4e4e7 !important;
  }
  html[data-theme="dark"] .site-button,
  html[data-theme="dark"] .theme-toggle {
    color: #e4e4e7 !important;
    border-color: rgba(228, 228, 231, 0.35) !important;
  }
  html[data-theme="dark"] .theme-toggle:hover,
  html[data-theme="dark"] .site-button:hover {
    background-color: rgba(228, 228, 231, 0.08) !important;
  }
  html[data-theme="dark"] .breadcrumb-nav-list-item,
  html[data-theme="dark"] .breadcrumb-nav-list-item a {
    color: #a1a1aa !important;
  }
</style>
<script>
(function() {
  var STORAGE_KEY = 'site-color-scheme';

  function resolveInitialScheme() {
    var saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch (_) {}
    if (saved === 'dark' || saved === 'light') return saved;
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      return 'dark';
    }
    return 'light';
  }

  function applyScheme(scheme) {
    document.documentElement.setAttribute('data-theme', scheme);
  }

  function setButtonLabel(btn) {
    var current = document.documentElement.getAttribute('data-theme') || 'light';
    btn.textContent = current === 'dark' ? '☀️ Claro' : '🌙 Oscuro';
  }

  function insertToggle() {
    if (document.getElementById('theme-toggle-btn')) return true;

    var auxList = document.querySelector('.aux-nav .aux-nav-list') ||
                  document.querySelector('.aux-nav');
    if (!auxList) return false;

    var btn = document.createElement('button');
    btn.id = 'theme-toggle-btn';
    btn.className = 'theme-toggle';
    btn.type = 'button';
    btn.setAttribute('aria-label', 'Cambiar entre modo claro y oscuro');
    btn.setAttribute('title', 'Cambiar entre modo claro y oscuro');

    btn.addEventListener('click', function() {
      var current = document.documentElement.getAttribute('data-theme') || 'light';
      var next = current === 'dark' ? 'light' : 'dark';
      applyScheme(next);
      try { localStorage.setItem(STORAGE_KEY, next); } catch (_) {}
      setButtonLabel(btn);
    });

    if (auxList.tagName === 'UL') {
      var li = document.createElement('li');
      li.className = 'aux-nav-list-item';
      li.appendChild(btn);
      auxList.appendChild(li);
    } else {
      auxList.appendChild(btn);
    }

    setButtonLabel(btn);
    return true;
  }

  function openContentLinksInNewTab() {
    var contentLinks = document.querySelectorAll('.main-content a[href]');
    contentLinks.forEach(function(a) {
      var href = a.getAttribute('href');
      if (!href) return;
      if (href.startsWith('#')) return;
      if (a.closest('nav')) return;
      if (a.closest('.site-nav')) return;
      if (a.closest('.breadcrumb-nav')) return;
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
    });
  }

  // Aplica el tema lo antes posible para evitar el "flash" claro antes
  // de que el DOM este listo. document.documentElement ya existe.
  applyScheme(resolveInitialScheme());

  function init() {
    applyScheme(resolveInitialScheme());
    var inserted = insertToggle();
    openContentLinksInNewTab();

    // Si por timing el aux-nav aun no estaba, reintenta hasta 3 s.
    if (!inserted) {
      var attempts = 0;
      var retry = setInterval(function() {
        attempts++;
        if (insertToggle() || attempts > 30) clearInterval(retry);
      }, 100);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
