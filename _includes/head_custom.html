<!--
  Comportamiento personalizado del sitio:

  1) Toggle claro/oscuro FLOTANTE, posicionado fijo en la esquina
     superior derecha. No depende de que el remote_theme tenga un
     aux-nav con una clase particular ni de timing con el DOM: se
     inyecta directamente al body con position:fixed.

     Dos razones por las que fue flotante y no dentro de la barra:
       - El `aux-nav` del tema vive dentro de un contenedor que a veces
         no esta listo al momento del DOMContentLoaded.
       - Con position:fixed el boton es visible en cualquier ancho de
         pantalla, incluido mobile donde el aux-nav se colapsa.

     La preferencia del usuario se guarda en localStorage con la clave
     `site-color-scheme`. Si nunca ha hecho click, respetamos
     `prefers-color-scheme` del sistema operativo.

  2) Dark mode manual. just-the-docs via remote_theme solo compila el
     stylesheet "default" (light). En vez de depender de jtd.setTheme
     (que necesita dos stylesheets precompilados), aplicamos una capa
     de overrides CSS cuando el <html> tiene el atributo
     data-theme="dark".

  3) Los enlaces DENTRO del contenido (no los del sidebar ni prev/next)
     se abren en una pestaña nueva, para que el lector no pierda su
     lugar.
-->
<style>
  /* ----- Toggle flotante (siempre visible) ----- */
  #theme-toggle-btn {
    position: fixed;
    top: 14px;
    right: 18px;
    z-index: 9999;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #ffffff;
    color: #1f2937;
    border: 1px solid rgba(0, 0, 0, 0.18);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  #theme-toggle-btn:hover {
    background: #f3f4f6;
  }
  #theme-toggle-btn:focus-visible {
    outline: 2px solid #3b82f6;
    outline-offset: 2px;
  }
  @media (max-width: 600px) {
    #theme-toggle-btn {
      top: 10px;
      right: 10px;
      padding: 5px 10px;
      font-size: 12px;
    }
  }

  /* ----- Dark mode overrides ----- */
  html[data-theme="dark"] {
    background-color: #0f1115 !important;
    color: #e5e7eb !important;
    color-scheme: dark;
  }
  html[data-theme="dark"] body {
    background-color: #0f1115 !important;
    color: #e5e7eb !important;
  }
  html[data-theme="dark"] .side-bar,
  html[data-theme="dark"] .main-header {
    background-color: #171a21 !important;
    border-color: #262a33 !important;
  }
  html[data-theme="dark"] .site-title {
    color: #f3f4f6 !important;
  }
  html[data-theme="dark"] .site-footer {
    color: #9ca3af !important;
  }
  html[data-theme="dark"] .site-footer a {
    color: #93c5fd !important;
  }
  html[data-theme="dark"] .nav-list .nav-list-item .nav-list-link {
    color: #cbd5e1 !important;
  }
  html[data-theme="dark"] .nav-list .nav-list-item .nav-list-link:hover {
    background-image: linear-gradient(-90deg, rgba(99, 102, 241, 0.18) 0%, rgba(99, 102, 241, 0.08) 100%) !important;
    color: #ffffff !important;
  }
  html[data-theme="dark"] .nav-list .nav-list-item .nav-list-link.active {
    background-image: linear-gradient(-90deg, rgba(99, 102, 241, 0.25) 0%, rgba(99, 102, 241, 0.12) 100%) !important;
    color: #ffffff !important;
    font-weight: 600;
  }
  html[data-theme="dark"] .nav-list-expander svg {
    color: #9ca3af !important;
  }
  html[data-theme="dark"] .main-content a {
    color: #93c5fd !important;
  }
  html[data-theme="dark"] .main-content a:hover {
    color: #bfdbfe !important;
  }
  html[data-theme="dark"] .main-content h1,
  html[data-theme="dark"] .main-content h2,
  html[data-theme="dark"] .main-content h3,
  html[data-theme="dark"] .main-content h4,
  html[data-theme="dark"] .main-content h5,
  html[data-theme="dark"] .main-content h6 {
    color: #f3f4f6 !important;
    border-color: #262a33 !important;
  }
  html[data-theme="dark"] .main-content strong {
    color: #f9fafb !important;
  }
  html[data-theme="dark"] .main-content code,
  html[data-theme="dark"] code.language-plaintext {
    background-color: #1f2229 !important;
    color: #fbbf24 !important;
    border: 1px solid #333740 !important;
  }
  html[data-theme="dark"] .main-content pre,
  html[data-theme="dark"] .main-content div.highlighter-rouge,
  html[data-theme="dark"] .main-content figure.highlight {
    background-color: #141720 !important;
    border: 1px solid #262a33 !important;
  }
  html[data-theme="dark"] .main-content pre code,
  html[data-theme="dark"] .main-content .highlight code {
    background-color: transparent !important;
    color: #e5e7eb !important;
    border: none !important;
  }
  html[data-theme="dark"] .main-content pre .c,
  html[data-theme="dark"] .main-content pre .c1,
  html[data-theme="dark"] .main-content pre .cm { color: #6b7280 !important; }
  html[data-theme="dark"] .main-content pre .k,
  html[data-theme="dark"] .main-content pre .kd,
  html[data-theme="dark"] .main-content pre .kn { color: #c084fc !important; }
  html[data-theme="dark"] .main-content pre .s,
  html[data-theme="dark"] .main-content pre .s1,
  html[data-theme="dark"] .main-content pre .s2 { color: #86efac !important; }
  html[data-theme="dark"] .main-content pre .n,
  html[data-theme="dark"] .main-content pre .na,
  html[data-theme="dark"] .main-content pre .nf { color: #e5e7eb !important; }
  html[data-theme="dark"] .main-content pre .mi,
  html[data-theme="dark"] .main-content pre .mf { color: #fbbf24 !important; }
  html[data-theme="dark"] .main-content table {
    border-color: #262a33 !important;
  }
  html[data-theme="dark"] .main-content table th {
    background-color: #1f2229 !important;
    color: #f3f4f6 !important;
    border-color: #262a33 !important;
  }
  html[data-theme="dark"] .main-content table td {
    background-color: #141720 !important;
    color: #e5e7eb !important;
    border-color: #262a33 !important;
  }
  html[data-theme="dark"] .main-content blockquote {
    background-color: #141720 !important;
    border-left-color: #4b5563 !important;
    color: #d1d5db !important;
  }
  html[data-theme="dark"] .main-content hr {
    background-color: #262a33 !important;
    border-color: #262a33 !important;
  }
  html[data-theme="dark"] .search-input,
  html[data-theme="dark"] .search-input-wrap {
    background-color: #141720 !important;
    color: #e5e7eb !important;
    border-color: #262a33 !important;
  }
  html[data-theme="dark"] .search-input::placeholder {
    color: #6b7280 !important;
  }
  html[data-theme="dark"] .search-results-list {
    background-color: #141720 !important;
    color: #e5e7eb !important;
  }
  html[data-theme="dark"] .site-button {
    color: #e5e7eb !important;
    border-color: rgba(228, 228, 231, 0.35) !important;
  }
  html[data-theme="dark"] .site-button:hover {
    background-color: rgba(228, 228, 231, 0.08) !important;
  }
  html[data-theme="dark"] .breadcrumb-nav-list-item,
  html[data-theme="dark"] .breadcrumb-nav-list-item a,
  html[data-theme="dark"] .breadcrumb-nav-list-item::before {
    color: #9ca3af !important;
  }
  html[data-theme="dark"] #theme-toggle-btn {
    background: #1f2229 !important;
    color: #f3f4f6 !important;
    border-color: #333740 !important;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
  }
  html[data-theme="dark"] #theme-toggle-btn:hover {
    background: #262a33 !important;
  }
</style>
<script>
(function() {
  var STORAGE_KEY = 'site-color-scheme';

  function resolveInitialScheme() {
    var saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch (_) {}
    if (saved === 'dark' || saved === 'light') return saved;
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      return 'dark';
    }
    return 'light';
  }

  function applyScheme(scheme) {
    document.documentElement.setAttribute('data-theme', scheme);
  }

  function setButtonLabel(btn) {
    var current = document.documentElement.getAttribute('data-theme') || 'light';
    btn.innerHTML = current === 'dark'
      ? '<span aria-hidden="true">&#9728;</span><span>Modo claro</span>'
      : '<span aria-hidden="true">&#9790;</span><span>Modo oscuro</span>';
  }

  function createToggle() {
    if (document.getElementById('theme-toggle-btn')) return;

    var btn = document.createElement('button');
    btn.id = 'theme-toggle-btn';
    btn.type = 'button';
    btn.setAttribute('aria-label', 'Cambiar entre modo claro y oscuro');
    btn.setAttribute('title', 'Cambiar entre modo claro y oscuro');

    btn.addEventListener('click', function() {
      var current = document.documentElement.getAttribute('data-theme') || 'light';
      var next = current === 'dark' ? 'light' : 'dark';
      applyScheme(next);
      try { localStorage.setItem(STORAGE_KEY, next); } catch (_) {}
      setButtonLabel(btn);
    });

    setButtonLabel(btn);
    document.body.appendChild(btn);
  }

  function openContentLinksInNewTab() {
    var contentLinks = document.querySelectorAll('.main-content a[href]');
    contentLinks.forEach(function(a) {
      var href = a.getAttribute('href');
      if (!href) return;
      if (href.startsWith('#')) return;
      if (a.closest('nav')) return;
      if (a.closest('.site-nav')) return;
      if (a.closest('.breadcrumb-nav')) return;
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
    });
  }

  // Aplica el tema lo antes posible para evitar el "flash" claro antes
  // de que el <body> este listo. document.documentElement ya existe.
  applyScheme(resolveInitialScheme());

  function init() {
    applyScheme(resolveInitialScheme());
    createToggle();
    openContentLinksInNewTab();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
