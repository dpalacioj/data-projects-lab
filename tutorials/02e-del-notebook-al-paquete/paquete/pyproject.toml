[project]
name = "analisis-ventas"
version = "0.1.0"
description = "Paquete de demostracion del tutorial 02e: calcular el precio promedio ponderado de ventas."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analisis_ventas"]
