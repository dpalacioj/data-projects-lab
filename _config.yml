# Configuracion de GitHub Pages (Jekyll).
#
# Convierte este repositorio en un sitio web navegable que renderiza
# los .md como paginas HTML. No duplica contenido: usa los README que
# ya existen.
#
# Tema: just-the-docs (sidebar + prev/next + busqueda).
# Explicacion linea por linea en tutorials/01c-tu-pagina-con-github-pages.md

title: Proyecto I — Laboratorio de Proyectos de Datos
description: Especialización en Ciencia de Datos e IA · Universidad de Medellín

# Tema de documentacion con sidebar, prev/next al pie de cada pagina,
# busqueda, breadcrumbs. Lo usan Jupyter Book, Fastai, muchos sitios de docs.
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

# Config del tema
# color_scheme define el tema por defecto; el usuario puede alternar
# claro/oscuro con el boton de la barra superior (ver _includes/head_custom.html).
# La preferencia se guarda en localStorage y persiste entre visitas.
color_scheme: light
search_enabled: true
heading_anchors: true
nav_sort: case_insensitive  # ordena el sidebar alfabeticamente ignorando mayusculas

# Diagramas Mermaid renderizados por el navegador.
# just-the-docs los soporta nativamente: cualquier bloque ```mermaid
# dentro de un .md se renderiza como SVG en el sitio publicado.
mermaid:
  version: "10.9.1"

# Enlace al repo de GitHub en el header del sitio
aux_links:
  "Ver en GitHub":
    - "https://github.com/dpalacioj/data-projects-lab"
aux_links_new_tab: true

# Footer custom
footer_content: "Material elaborado por <strong>David Palacio Jimenez, MEng</strong> · Licencia MIT · <a href='https://github.com/dpalacioj/data-projects-lab'>Codigo fuente</a> · <a href='https://www.linkedin.com/in/davidpalacioj/' target='_blank'>LinkedIn</a>"

# ---------------------------------------------------------------------------
# Lo que Jekyll ignora al construir el sitio.
# Archivos de codigo, datos, modelos, y configs no son contenido pedagogico.
# ---------------------------------------------------------------------------
exclude:
  # Notebooks y codigo Python
  - "**/*.ipynb"
  - "**/*.py"
  - "**/__pycache__/"

  # Datos y modelos (binarios o CSV)
  - "**/*.csv"
  - "**/*.joblib"
  - "**/*.pth"
  - "**/*.parquet"
  - "**/*.xlsx"
  - "**/*.jsonlines"
  - "**/*.gz"
  - "**/*.zip"

  # Subcarpetas tipicas de los proyectos (contienen codigo/datos)
  - "**/src/"
  - "**/app/"
  - "**/tests/"
  - "**/data/"
  - "**/models/"
  - "**/reports/"
  - "**/notebooks/"
  - "**/scripts/"
  - "**/mlruns/"

  # Carpetas de nivel raiz que no son contenido para el estudiante
  - datasets/
  - imagenes/
  - tests/
  - scripts/
  - docs/material-estudiante/

  # Material de preparacion interna (no se publica para el estudiante)
  - sesiones/_templates/
  - sesiones/s02-exploracion-polars/08-checklist-dia-de-clase.md
  - sesiones/s03-procesamiento-sklearn/08-checklist-dia-de-clase.md

  # Configuracion del proyecto Python
  - uv.lock
  - pyproject.toml
  - Makefile

  # Dotfiles explicitos (algunos ya los excluye Jekyll por default)
  - .gitignore
  - .gitattributes
  - .python-version
