default_language_version:
  python: python3.11

# Alcance de esta configuracion: proyecto `segmentacion-clientes/` (Unidad 2).
# Los demas proyectos del repo tienen convenciones distintas y outputs
# historicos committeados; no se saneen aqui para evitar ruido en la PR.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(projects/segmentacion-clientes/|\.pre-commit-config\.yaml$|pyproject\.toml$)
        exclude: '\.(ipynb|md)$'
      - id: end-of-file-fixer
        files: ^(projects/segmentacion-clientes/|\.pre-commit-config\.yaml$|pyproject\.toml$)
        exclude: '\.(ipynb|md)$'
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        files: ^projects/segmentacion-clientes/notebooks/.*\.ipynb$
        description: "Strip output cells of U2 notebooks before commit."

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^(projects/segmentacion-clientes/|\.pre-commit-config\.yaml$|pyproject\.toml$)
      - id: ruff-format
        files: ^projects/segmentacion-clientes/.*\.py$
