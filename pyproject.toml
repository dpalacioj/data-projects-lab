[project]
name = "data-projects-lab"
version = "0.1.0"
description = "Repositorio educativo con proyectos de Data Science y Machine Learning"
authors = [
    {name = "David Palacio Jiménez", email = "davidpalacioj@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

# Dependencias mínimas para data science
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.9",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "jupyter>=1.0.0",
    "ipykernel>=7.0.1",
    "nbconvert>=7.16.6",
]

[project.optional-dependencies]
# Proyecto Titanic (AutoML)
titanic = [
    "flaml[automl]>=2.3.6",
    "streamlit>=1.50.0",
    "plotly>=5.5.0",
]

# Proyecto Clasificador Meli (ML clásico)
meli = [
    "xgboost>=1.5.0",
    "pydantic>=1.8.0",
    "joblib>=1.0.0",
    "scipy>=1.5.0",
]

# Proyecto Regresión Automóviles (MLOps)
regresion-automoviles = [
    "mlflow>=3.5.1",
    "gradio>=5.0.0",
    "fastapi>=0.120.0",
    "uvicorn>=0.30.0",
    "lightgbm>=4.6.0",
]

# Proyecto Segmentación de Clientes (clustering no supervisado)
segmentacion-clientes = [
    "streamlit>=1.50.0",
    "plotly>=5.5.0",
    "openpyxl>=3.1.0",
    "joblib>=1.3.0",
    "pyarrow>=14.0.0",
    "polars>=2.0",
    "fastexcel>=0.11",
    "skimpy>=0.0.15",
    "fg-data-profiling>=0.1",
    "pydantic>=2.0",
]

# Extras temáticos
interpretability = [
    "shap>=0.45.0",
    "lime>=0.2.0",
]

optimization = [
    "optuna>=3.0.0",
]

experiment = [
    "mlflow>=3.5.1",
    "wandb>=0.15.0",
]

# Interfaz web (compartido entre proyectos)
web = [
    "streamlit>=1.50.0",
    "plotly>=5.0.0",
    "gradio>=5.0.0",
]

# Desarrollo
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "ipython>=8.0.0",
]

# Instalación completa
all = [
    "data-projects-lab[titanic,meli,regresion-automoviles,segmentacion-clientes,interpretability,optimization,experiment,web,dev]",
]

[project.urls]
Homepage = "https://github.com/dpalacioj/data-projects-lab"
Repository = "https://github.com/dpalacioj/data-projects-lab"
Issues = "https://github.com/dpalacioj/data-projects-lab/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Este repositorio no se distribuye como paquete: es una coleccion de
# proyectos educativos. Le decimos a hatchling que no intente empaquetar
# nada para que `uv sync` pueda instalar dependencias sin error.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
line-length = 100
target-version = "py311"
# Ruff en esta spec cubre el paquete, cuadernos, scripts y tests de la Unidad 2;
# el resto de proyectos tiene lint pre-existente que se saneara en otra tanda.
extend-exclude = [
    "projects/titanic",
    "projects/clasificador-meli",
    "projects/prediccion-precios-automoviles",
    "projects/ejercicio-preprocesamiento",
    "projects/promociones_usuarios",
    "projects/temporal-split",
    "projects/threholds-example",
    "tutorials",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E501: line length ya la controla el formatter. Las reglas N* (naming) chocan
# con convenciones de sklearn (`X`, `X_2d`), constantes de dominio
# (`DBSCAN_PARAMS`) y nombres descriptivos de tests que referencian la factura
# "C"; no las imponemos.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# scripts de referencia tienen matplotlib.use("Agg") antes de los imports.
"projects/segmentacion-clientes/scripts/caso_recompra.py" = ["E402"]
"projects/segmentacion-clientes/scripts/figuras_u3.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests", "projects/segmentacion-clientes/tests"]
pythonpath = ["projects/segmentacion-clientes/src"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v"
markers = [
    "slow: cifras del OVA de la Unidad 2 verificadas contra el parquet real (requiere data/raw/online_retail_II.parquet)",
]
