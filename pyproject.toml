[project]
name = "data-projects-lab"
version = "0.1.0"
description = "Repositorio educativo con proyectos de Data Science y Machine Learning"
authors = [
    {name = "David Palacio Jiménez", email = "davidpalacioj@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

# Dependencias mínimas para data science
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.9",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "jupyter>=1.0.0",
    "ipykernel>=7.0.1",
    "nbconvert>=7.16.6",
]

[project.optional-dependencies]
# Proyecto Titanic (AutoML)
titanic = [
    "flaml[automl]>=2.3.6",
    "streamlit>=1.50.0",
    "plotly>=5.5.0",
]

# Proyecto Clasificador Meli (ML clásico)
meli = [
    "xgboost>=1.5.0",
    "pydantic>=1.8.0",
    "joblib>=1.0.0",
    "scipy>=1.5.0",
]

# Proyecto Regresión Automóviles (MLOps)
regresion-automoviles = [
    "mlflow>=3.5.1",
    "gradio>=5.0.0",
    "fastapi>=0.120.0",
    "uvicorn>=0.30.0",
    "lightgbm>=4.6.0",
]

# Proyecto Segmentación de Clientes (clustering no supervisado)
segmentacion-clientes = [
    "streamlit>=1.50.0",
    "plotly>=5.5.0",
    "openpyxl>=3.1.0",
    "joblib>=1.3.0",
    "pyarrow>=14.0.0",
    "polars>=2.0",
    "fastexcel>=0.11",
    "skimpy>=0.0.15",
    "fg-data-profiling>=0.1",
    "pydantic>=2.0",
    "fastapi>=0.120.0",
    "uvicorn>=0.30.0",
    "httpx>=0.28.0",
]

# Proyecto Ejemplo Completo (clasificador tabular con flujo end-to-end)
# Es el proyecto que el estudiante toma de referencia para su trabajo final.
ejemplo-completo = [
    "streamlit>=1.50.0",
    "fastapi>=0.120.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0",
    "joblib>=1.3.0",
]

# Proyecto Ingesta de Eventos de E-commerce (JSON anidado -> BD relacional)
# Enseña: datos no tabulares + conexion a una base de datos como en produccion.
# Backend por defecto: SQLite (cero setup). Alternativo: Postgres via DATABASE_URL.
ingesta-eventos = [
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "streamlit>=1.50.0",
    "plotly>=5.5.0",
    "pandas>=2.1.0",
]

# Proyecto Chat con tu BD (LangChain + LangGraph + LLM open source)
# Enseña: NL -> SQL con un LLM local (Ollama) o remoto (HuggingFace).
# Progresion: chain simple -> agente con tools -> grafo con auto-correccion.
chat-bd = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-ollama>=0.2",
    "langchain-huggingface>=0.1",
    "langgraph>=0.2",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "streamlit>=1.50.0",
    "pydantic>=2.0",
]

# Proyecto Reconocimiento de Imágenes (CNN + transfer learning)
reconocimiento-imagenes = [
    "torch>=2.2",
    "torchvision>=0.17",
    "pillow>=10.0",
    "streamlit>=1.50.0",
    "fastapi>=0.120.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]

# Extras temáticos
interpretability = [
    "shap>=0.45.0",
    "lime>=0.2.0",
]

optimization = [
    "optuna>=3.0.0",
]

experiment = [
    "mlflow>=3.5.1",
    "wandb>=0.15.0",
]

# Interfaz web (compartido entre proyectos)
web = [
    "streamlit>=1.50.0",
    "plotly>=5.0.0",
    "gradio>=5.0.0",
]

# Desarrollo
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "ipython>=8.0.0",
]

# Instalación completa
all = [
    "data-projects-lab[titanic,meli,regresion-automoviles,segmentacion-clientes,ejemplo-completo,ingesta-eventos,chat-bd,reconocimiento-imagenes,interpretability,optimization,experiment,web,dev]",
]

[project.urls]
Homepage = "https://github.com/dpalacioj/data-projects-lab"
Repository = "https://github.com/dpalacioj/data-projects-lab"
Issues = "https://github.com/dpalacioj/data-projects-lab/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Este repositorio no se distribuye como paquete: es una coleccion de
# proyectos educativos. Le decimos a hatchling que no intente empaquetar
# nada para que `uv sync` pueda instalar dependencias sin error.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
line-length = 100
target-version = "py311"
# Esta configuracion de Ruff cubre el paquete, cuadernos, scripts y tests de la Unidad 2;
# el resto de proyectos tiene lint pre-existente que se saneara en otra tanda.
extend-exclude = [
    "projects/01-titanic",
    "projects/02-clasificador-meli",
    "projects/03-prediccion-precios-automoviles",
    "projects/d1-ejercicio-preprocesamiento",
    "projects/d2-temporal-split",
    "projects/d4-umbrales-ejemplo",
    "projects/d3-promociones-usuarios",
    "projects/04-reconocimiento-imagenes",
    "tutorials",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E501: line length ya la controla el formatter. Las reglas N* (naming) chocan
# con convenciones de sklearn (`X`, `X_2d`), constantes de dominio
# (`DBSCAN_PARAMS`) y nombres descriptivos de tests que referencian la factura
# "C"; no las imponemos.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# scripts de referencia tienen matplotlib.use("Agg") antes de los imports.
"projects/00-segmentacion-clientes/scripts/caso_recompra.py" = ["E402"]
"projects/00-segmentacion-clientes/scripts/figuras_u3.py" = ["E402"]
# El notebook del proyecto 05 manipula sys.path antes de importar
# (patron sys.path.insert + import, didactico). E402 e I001 son esperables.
"projects/05-ejemplo-completo/notebooks/*.ipynb" = ["E402", "I001", "F401"]
# Las apps de proyecto 05 tambien ajustan sys.path para importar desde src/
"projects/05-ejemplo-completo/app/*.py" = ["E402"]
# El notebook y las apps del proyecto 06 ajustan sys.path antes de importar.
"projects/06-ingesta-eventos-ecommerce/notebooks/*.ipynb" = ["E402", "I001", "F401"]
"projects/06-ingesta-eventos-ecommerce/app/*.py" = ["E402"]
# Idem para el proyecto 07.
"projects/07-chat-con-tu-bd/notebooks/*.ipynb" = ["E402", "I001", "F401"]
"projects/07-chat-con-tu-bd/app/*.py" = ["E402"]
# La app Streamlit del caso guia ajusta sys.path antes de importar (Unidad 4).
"projects/00-segmentacion-clientes/app/recompra_streamlit.py" = ["E402"]
# La API FastAPI del caso guia tambien ajusta sys.path antes de importar.
"projects/00-segmentacion-clientes/api/main.py" = ["E402"]
# Scripts de preparacion de datos ajustan sys.path antes de importar
# `segmentacion.*`; el patron es didactico (correr sin instalar el paquete).
"projects/00-segmentacion-clientes/scripts/preparar_datos.py" = ["E402", "I001"]
"projects/00-segmentacion-clientes/scripts/generar_features_clientes.py" = ["E402", "I001"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "projects/00-segmentacion-clientes/tests",
    "projects/05-ejemplo-completo/tests",
    "projects/06-ingesta-eventos-ecommerce/tests",
    "projects/07-chat-con-tu-bd/tests",
]
pythonpath = [
    "projects/00-segmentacion-clientes/src",
    "projects/05-ejemplo-completo/src",
    "projects/06-ingesta-eventos-ecommerce/src",
    "projects/07-chat-con-tu-bd/src",
]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v"
markers = [
    "slow: cifras de referencia de la Unidad 2 verificadas contra el parquet real (requiere data/raw/online_retail_II.parquet)",
]
